<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cam Profile Designer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #eceff1;
      color: #37474f;
      height: 100vh;
      overflow: hidden;
      font-size: 13px;
    }

    #root { display: flex; height: 100vh; }

    /* ── LEFT PANEL ─────────────────────────────────────────── */
    #controls {
      width: 310px;
      flex-shrink: 0;
      background: #ffffff;
      border-right: 1px solid #cfd8dc;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .app-title {
      font-size: 15px;
      font-weight: 700;
      color: #1565c0;
      border-bottom: 2px solid #1565c0;
      padding-bottom: 10px;
      line-height: 1.3;
    }

    .section { display: flex; flex-direction: column; gap: 10px; }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #90a4ae;
    }

    .field-row { display: flex; align-items: center; gap: 8px; }
    .field-row label { min-width: 85px; color: #546e7a; }

    input[type="number"], input[type="text"] {
      padding: 5px 8px;
      border: 1px solid #b0bec5;
      border-radius: 4px;
      font-size: 13px;
      color: #37474f;
      background: #fafafa;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="number"]:focus, input[type="text"]:focus {
      border-color: #1565c0;
      background: #fff;
    }
    input[type="number"] { width: 72px; }

    .unit-label { color: #90a4ae; font-size: 12px; }

    .info-box {
      background: #e3f2fd;
      border: 1px solid #bbdefb;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 12px;
      color: #1565c0;
    }

    /* ── NODE LIST ──────────────────────────────────────────── */
    #node-list { display: flex; flex-direction: column; gap: 8px; }

    .node-card {
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }

    .node-card-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: #f5f5f5;
      border-bottom: 1px solid #e0e0e0;
    }

    .node-badge {
      font-size: 11px;
      font-weight: 700;
      color: #fff;
      background: #1565c0;
      border-radius: 10px;
      min-width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      flex-shrink: 0;
    }

    .node-name-input {
      flex: 1;
      padding: 3px 6px;
      border: 1px solid transparent;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 600;
      background: transparent;
    }
    .node-name-input:focus { border-color: #1565c0; background: #fff; }

    .node-remove-btn {
      padding: 2px 7px;
      background: none;
      border: 1px solid #ef5350;
      color: #ef5350;
      border-radius: 3px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1.4;
      transition: all 0.15s;
    }
    .node-remove-btn:hover:not(:disabled) { background: #ef5350; color: #fff; }
    .node-remove-btn:disabled { opacity: 0.25; cursor: default; }

    .node-card-body {
      padding: 8px;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .node-field { display: flex; flex-direction: column; gap: 3px; }

    .node-field-label {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #90a4ae;
    }

    .input-unit-row { display: flex; align-items: center; gap: 4px; }

    .node-field input[type="number"] { width: 60px; padding: 4px 6px; }

    .node-lock-btn {
      padding: 5px 7px;
      background: #fafafa;
      border: 1px solid #b0bec5;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all 0.15s;
      margin-top: auto;
    }
    .node-lock-btn.locked { background: #fff8e1; border-color: #ffb300; }

    .node-controls { display: flex; gap: 8px; }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }

    .btn-primary { background: #1565c0; color: #fff; flex: 1; }
    .btn-primary:hover { background: #0d47a1; }

    .duration-total {
      font-size: 11px;
      color: #546e7a;
      text-align: right;
      padding-right: 2px;
    }
    .duration-total.ok  { color: #2e7d32; }
    .duration-total.warn { color: #d32f2f; font-weight: 600; }

    .export-btns { display: flex; flex-direction: column; gap: 8px; }

    .btn-export {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-export-outline  { background: #37474f; color: #fff; }
    .btn-export-outline:hover  { background: #263238; }
    .btn-export-labeled  { background: #2e7d32; color: #fff; }
    .btn-export-labeled:hover  { background: #1b5e20; }
    .btn-export-svg      { background: #1565c0; color: #fff; }
    .btn-export-svg:hover      { background: #0d47a1; }

    /* Save / Load JSON row */
    .btn-json-row { display: flex; gap: 8px; }
    .btn-json {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-json-save { background: #546e7a; color: #fff; }
    .btn-json-save:hover { background: #37474f; }
    .btn-json-load { background: #78909c; color: #fff; }
    .btn-json-load:hover { background: #546e7a; }

    /* Toggle button (hole shape, etc.) */
    .btn-toggle {
      padding: 4px 8px;
      background: #fafafa;
      border: 1px solid #b0bec5;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      transition: all 0.15s;
      min-width: 34px;
      text-align: center;
      flex-shrink: 0;
    }
    .btn-toggle:hover { background: #e3f2fd; border-color: #1565c0; }

    /* Inline checkbox + label */
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #546e7a;
      cursor: pointer;
      white-space: nowrap;
      font-size: 12px;
      flex-shrink: 0;
    }
    .checkbox-label input[type="checkbox"] { cursor: pointer; }

    /* Sub-section divider */
    .sub-divider {
      border: none;
      border-top: 1px solid #eceff1;
      margin: 2px 0;
    }

    /* Per-node curve mode button */
    .node-curve-btn {
      padding: 5px 7px;
      background: #fafafa;
      border: 1px solid #b0bec5;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      transition: all 0.15s;
      margin-top: auto;
      min-width: 36px;
      text-align: center;
    }
    .node-curve-btn.mode-sharp  { background: #fff3e0; border-color: #ff9800; color: #e65100; }
    .node-curve-btn.mode-direct { background: #e8f5e9; border-color: #4caf50; color: #1b5e20; }
    .node-curve-btn.mode-bezier { background: #fce4ec; border-color: #e91e63; color: #880e4f; }

    /* ── CANVAS AREA ────────────────────────────────────────── */
    #canvas-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 8px;
      min-width: 0;
    }

    #canvas-wrapper {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #cam-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.12);
    }

    .canvas-info {
      font-size: 11px;
      color: #90a4ae;
      text-align: center;
    }
  </style>
</head>
<body>
<div id="root">

  <!-- ── LEFT PANEL ─────────────────────────────────────── -->
  <aside id="controls">
    <h1 class="app-title">Cam Profile<br>Designer</h1>

    <!-- Dimensions -->
    <div class="section">
      <div class="section-title">Dimensions</div>

      <div class="field-row">
        <label>Base Circle</label>
        <input type="number" id="input-base" min="1" max="500" step="1" value="50">
        <span class="unit-label">mm</span>
      </div>

      <div class="field-row">
        <label>Travel</label>
        <input type="number" id="input-travel" min="0" max="500" step="1" value="60">
        <span class="unit-label">mm</span>
      </div>

      <hr class="sub-divider">

      <!-- Central hole -->
      <div class="field-row">
        <label>Centre Hole ⌀</label>
        <input type="number" id="input-hole-dia" min="0" max="500" step="0.5"
               placeholder="—" style="width:60px">
        <span class="unit-label">mm</span>
        <button id="btn-hole-shape" class="btn-toggle" title="Hole shape — click to cycle">○</button>
      </div>

      <hr class="sub-divider">

      <!-- Channel & outer piece -->
      <div class="field-row">
        <label>Channel Width</label>
        <input type="number" id="input-channel-width" min="0" max="200" step="0.5" value="2">
        <span class="unit-label">mm</span>
      </div>

      <div class="field-row">
        <label>Outer Width</label>
        <input type="number" id="input-outer-width" min="0" max="500" step="0.5" value="10">
        <span class="unit-label">mm</span>
        <label class="checkbox-label">
          <input type="checkbox" id="chk-outer-circle" checked> Circle
        </label>
      </div>

      <div class="info-box">
        Max radius: <strong id="max-radius-val">110</strong> mm
        &nbsp;·&nbsp; ⌀ <strong id="max-dia-val">220</strong> mm
      </div>
    </div>

    <!-- Nodes -->
    <div class="section">
      <div class="section-title">Cam Nodes</div>
      <div id="node-list"></div>
      <div class="duration-total" id="duration-total">Total: 100.00%</div>
      <div class="node-controls">
        <button class="btn btn-primary" id="btn-add-node">+ Add Node</button>
      </div>
    </div>

    <!-- Export -->
    <div class="section">
      <div class="section-title">Export — True to Size SVG</div>
      <div class="export-btns">
        <div class="btn-json-row">
          <button class="btn-json btn-json-save" id="btn-save-json">Save</button>
          <button class="btn-json btn-json-load" id="btn-load-json">Load</button>
        </div>
        <button class="btn-export btn-export-outline" id="btn-save-outline">
          Save Outline
        </button>
        <button class="btn-export btn-export-labeled" id="btn-save-labeled">
          Save Labelled
        </button>
        <button class="btn-export btn-export-svg" id="btn-save-svg">
          Save SVG
        </button>
      </div>
    </div>
  </aside>

  <!-- ── CANVAS ─────────────────────────────────────────── -->
  <main id="canvas-area">
    <div id="canvas-wrapper">
      <canvas id="cam-canvas"></canvas>
    </div>
    <div class="canvas-info" id="canvas-info">
      Base: 50 mm · Travel: 60 mm · Max Radius: 110 mm
    </div>
  </main>

</div>

<script>
// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
const state = {
  baseCircle:   50,
  travel:       60,
  holeDiameter: null,   // mm, null = no hole (just crosshair)
  holeShape:    'circle', // 'circle' | 'square' | 'rectangle' | 'octagon'
  channelWidth: 2,      // mm gap between cam and outer piece
  outerWidth:   10,     // mm width of outer piece; 0 = disabled
  outerCircle:  true,   // true = circular outer edge; false = cam-conforming
  nodes: [
    { id: 1, name: 'Node 1', mm: 0,  duration: 50, locked: false, curveMode: 'soft', cpIn: { dt: 0, dr: 0 }, cpOut: { dt: 0, dr: 0 } },
    { id: 2, name: 'Node 2', mm: 60, duration: 50, locked: false, curveMode: 'soft', cpIn: { dt: 0, dr: 0 }, cpOut: { dt: 0, dr: 0 } }
  ],
  nextId: 3
};

// Canvas geometry — updated by draw() so mouse handlers can convert px → polar
let _cx = 0, _cy = 0, _scale = 1;
// Bezier drag state
let _drag    = null;   // { nodeIdx, type: 'in'|'out' } or null
let _handles = [];     // [{ nodeIdx, type, x, y }, …] repopulated each draw()

// ── Curve mode helpers ─────────────────────────────────
const CURVE_MODES   = ['soft', 'sharp', 'direct', 'bezier'];
const nextCurveMode = mode => CURVE_MODES[(CURVE_MODES.indexOf(mode || 'soft') + 1) % CURVE_MODES.length];
const curveIcon     = mode => ({ sharp: '∧', direct: '⌒', bezier: '⌘' })[mode] ?? '~';
const curveLabel    = mode => ({ sharp: 'Sharp', direct: 'Direct (arc)', bezier: 'Bezier' })[mode] ?? 'Soft';

// ════════════════════════════════════════════════════════
//  GEOMETRY HELPERS
// ════════════════════════════════════════════════════════
const maxRadius = () => state.baseCircle + state.travel;

/** Catmull-Rom–style slopes (dr/dθ) at each node, given radius and span arrays. */
function computeSlopes(radii, spans) {
  const n = radii.length;
  return radii.map((_, i) => {
    const prev  = (i - 1 + n) % n;
    const next  = (i + 1) % n;
    const total = spans[prev] + spans[i];
    return total < 1e-10 ? 0 : (radii[next] - radii[prev]) / total;
  });
}

/** Cumulative start angles (radians) for each node. */
function nodeAngles() {
  const out = [];
  let cum = 0;
  for (const n of state.nodes) {
    out.push(cum * Math.PI * 2 / 100);
    cum += n.duration;
  }
  return out;
}

/**
 * Cam radius at polar angle theta (radians), interpolated with a
 * Hermite / Catmull-Rom spline so the curve is C1-smooth everywhere.
 */
function radiusAtAngle(theta) {
  const nodes  = state.nodes;
  const n      = nodes.length;
  if (n === 0) return state.baseCircle;
  if (n === 1) return state.baseCircle + nodes[0].mm;

  const TWO_PI = Math.PI * 2;

  // Angular span of each segment (radians)
  const spans  = nodes.map(nd => nd.duration / 100 * TWO_PI);
  const angles = nodeAngles();
  const radii  = nodes.map(nd => state.baseCircle + nd.mm);

  // Catmull-Rom–style slopes at each node (periodic)
  const slopes = computeSlopes(radii, spans);

  // Normalise theta → [0, 2π)
  theta = ((theta % TWO_PI) + TWO_PI) % TWO_PI;

  // Find which segment theta falls in
  let seg = n - 1;   // default: last segment (wraps to 0)
  for (let i = 0; i < n - 1; i++) {
    if (theta >= angles[i] && theta < angles[i + 1]) { seg = i; break; }
  }

  const next = (seg + 1) % n;
  const h    = spans[seg];
  if (h < 1e-10) return radii[seg];

  const t  = (theta - angles[seg]) / h;
  const t2 = t * t, t3 = t2 * t;

  const mode = nodes[seg].curveMode || 'soft';
  let r;

  if (mode === 'sharp') {
    // Linear interpolation — straight line in polar (r, θ) space; sharp joints at nodes
    r = radii[seg] + t * (radii[next] - radii[seg]);

  } else if (mode === 'direct') {
    // Zero-slope Hermite — arc centred on the cam origin.
    // When both endpoints share the same radius the path is exactly that circle.
    const h00 =  2*t3 - 3*t2 + 1;
    const h01 = -2*t3 + 3*t2;
    r = h00 * radii[seg] + h01 * radii[next];

  } else if (mode === 'bezier') {
    // Bezier — Hermite with user-controlled slopes derived from handle offsets
    const co = nodes[seg].cpOut,  ci = nodes[next].cpIn;
    const m0 = (co && Math.abs(co.dt) > 1e-10) ? co.dr / co.dt : slopes[seg];
    const m1 = (ci && Math.abs(ci.dt) > 1e-10) ? ci.dr / ci.dt : slopes[next];
    const h00 =  2*t3 - 3*t2 + 1;
    const h10 =    t3 - 2*t2 + t;
    const h01 = -2*t3 + 3*t2;
    const h11 =    t3 -   t2;
    r = h00 * radii[seg]  + h10 * m0 * h
      + h01 * radii[next] + h11 * m1 * h;

  } else {
    // Soft — full Catmull-Rom / Hermite spline (original behaviour)
    const h00 =  2*t3 - 3*t2 + 1;
    const h10 =    t3 - 2*t2 + t;
    const h01 = -2*t3 + 3*t2;
    const h11 =    t3 -   t2;
    r = h00 * radii[seg]  + h10 * slopes[seg]  * h
      + h01 * radii[next] + h11 * slopes[next] * h;
  }

  return Math.max(0, r);
}

// Convert polar angle + radius to canvas (x,y)
// Convention: theta=0 → top (12-o'clock), clockwise
function polarToXY(cx, cy, theta, r, scale) {
  return {
    x: cx + Math.sin(theta) * r * scale,
    y: cy - Math.cos(theta) * r * scale
  };
}

// ════════════════════════════════════════════════════════
//  CANVAS DRAWING
// ════════════════════════════════════════════════════════
function draw() {
  const canvas  = document.getElementById('cam-canvas');
  const wrapper = document.getElementById('canvas-wrapper');
  const rect    = wrapper.getBoundingClientRect();

  canvas.width  = Math.floor(rect.width);
  canvas.height = Math.floor(rect.height);

  const W = canvas.width, H = canvas.height;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  const maxR        = maxRadius();
  const outerExtent = state.outerWidth > 0
    ? maxR + state.channelWidth + state.outerWidth
    : maxR;
  const padPx  = 52;
  const scale  = (Math.min(W, H) / 2 - padPx) / outerExtent;
  const cx     = W / 2, cy = H / 2;
  const TWO_PI = Math.PI * 2;
  // Expose for mouse event handlers
  _cx = cx; _cy = cy; _scale = scale;

  // Background
  ctx.fillStyle = '#fafafa';
  ctx.fillRect(0, 0, W, H);

  // ── Reference circles (dashed) ──────────────────────
  ctx.save();
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = '#c5d3d9';
  ctx.lineWidth = 1;

  ctx.beginPath();
  ctx.arc(cx, cy, state.baseCircle * scale, 0, TWO_PI);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(cx, cy, maxR * scale, 0, TWO_PI);
  ctx.stroke();
  ctx.restore();

  // Circle dimension labels
  ctx.save();
  ctx.font = '10px sans-serif';
  ctx.fillStyle = '#b0bec5';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  const bLabelX = cx + state.baseCircle * scale + 4;
  const mLabelX = cx + maxR * scale + 4;
  // Only draw if there's room
  if (bLabelX + 52 < W - 4)
    ctx.fillText(`ø${state.baseCircle * 2} mm`, bLabelX, cy);
  if (mLabelX + 52 < W - 4)
    ctx.fillText(`ø${maxR * 2} mm`, mLabelX, cy);
  ctx.restore();

  // ── Start line ───────────────────────────────────────
  ctx.save();
  ctx.strokeStyle = '#ef5350';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 3]);
  ctx.beginPath();
  ctx.moveTo(cx, cy + state.baseCircle * scale * 0.25);
  ctx.lineTo(cx, cy - outerExtent * scale - 16);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#ef5350';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText('START', cx, cy - outerExtent * scale - 18);
  ctx.restore();

  // ── Cam profile (sampled polar curve) ────────────────
  const SAMPLES = 720;
  const holeR = state.holeDiameter ? state.holeDiameter / 2 : 0;

  // Helper: build cam profile path commands into current ctx path
  function addCamPath() {
    for (let i = 0; i <= SAMPLES; i++) {
      const theta = (i / SAMPLES) * TWO_PI;
      const r = radiusAtAngle(theta);
      const { x, y } = polarToXY(cx, cy, theta, r, scale);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // Helper: build offset cam path (cam radius + offset mm) into current ctx path
  function addOffsetCamPath(offsetMM) {
    for (let i = 0; i <= SAMPLES; i++) {
      const theta = (i / SAMPLES) * TWO_PI;
      const r = radiusAtAngle(theta) + offsetMM;
      const { x, y } = polarToXY(cx, cy, theta, r, scale);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  // Fill cam + hole cutout (evenodd)
  ctx.save();
  ctx.beginPath();
  addCamPath();
  if (holeR > 0) addHolePath(ctx, cx, cy, holeR * scale, state.holeShape);
  ctx.fillStyle = 'rgba(21,101,192,0.07)';
  ctx.fill('evenodd');
  ctx.restore();

  // Stroke cam outline
  ctx.save();
  ctx.beginPath();
  addCamPath();
  ctx.strokeStyle = '#1565c0';
  ctx.lineWidth   = 2;
  ctx.stroke();
  ctx.restore();

  // ── Outer piece (channel + outer ring) ───────────────
  if (state.outerWidth > 0) {
    const cw = state.channelWidth;
    const ow = state.outerWidth;
    const outerCircleR = (maxR + cw + ow) * scale;

    // Fill outer ring (evenodd: outer path + inner cutout)
    ctx.save();
    ctx.beginPath();
    if (state.outerCircle) {
      ctx.arc(cx, cy, outerCircleR, 0, TWO_PI);  // outer circle
    } else {
      addOffsetCamPath(cw + ow);                  // outer shaped
    }
    addOffsetCamPath(cw);                          // inner (channel boundary)
    ctx.fillStyle = 'rgba(255,152,0,0.10)';
    ctx.fill('evenodd');
    ctx.restore();

    // Stroke outer edge
    ctx.save();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#e65100';
    ctx.beginPath();
    if (state.outerCircle) {
      ctx.arc(cx, cy, outerCircleR, 0, TWO_PI);
    } else {
      addOffsetCamPath(cw + ow);
    }
    ctx.stroke();
    ctx.restore();

    // Stroke inner edge of outer piece (channel boundary) — dashed
    ctx.save();
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#ff9800';
    ctx.setLineDash([3, 2]);
    ctx.beginPath();
    addOffsetCamPath(cw);
    ctx.stroke();
    ctx.restore();
  }

  // ── Central hole outline ──────────────────────────────
  if (holeR > 0) {
    ctx.save();
    ctx.beginPath();
    addHolePath(ctx, cx, cy, holeR * scale, state.holeShape);
    ctx.fillStyle   = 'rgba(255,255,255,0.85)';
    ctx.fill();
    ctx.strokeStyle = '#546e7a';
    ctx.lineWidth   = 1;
    ctx.stroke();
    ctx.restore();
  }

  // ── Node markers ─────────────────────────────────────
  const angles = nodeAngles();
  state.nodes.forEach((node, i) => {
    const theta = angles[i];
    const r     = state.baseCircle + node.mm;
    const { x, y } = polarToXY(cx, cy, theta, r, scale);

    // Dot
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, TWO_PI);
    ctx.fillStyle   = '#1565c0';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    ctx.restore();

    // Label – nudge outward from centre
    const nx = Math.sin(theta), ny = -Math.cos(theta); // unit outward vector
    const OFFSET = 14;
    const lx = x + nx * OFFSET;
    const ly = y + ny * OFFSET;

    ctx.save();
    ctx.font         = '11px sans-serif';
    ctx.fillStyle    = '#37474f';
    ctx.textAlign    = nx >  0.15 ? 'left'
                     : nx < -0.15 ? 'right' : 'center';
    ctx.textBaseline = ny >  0.15 ? 'top'
                     : ny < -0.15 ? 'bottom' : 'middle';
    ctx.fillText(node.name, lx, ly);
    ctx.restore();
  });

  // ── Bezier control handles ────────────────────────────
  _handles = [];
  {
    const n     = state.nodes.length;
    const spans = state.nodes.map(nd => nd.duration / 100 * TWO_PI);

    state.nodes.forEach((node, i) => {
      const theta_i = angles[i];
      const r_i     = state.baseCircle + node.mm;
      const { x: px, y: py } = polarToXY(cx, cy, theta_i, r_i, scale);

      // Outgoing handle — for the segment FROM this node (uses node.cpOut)
      if ((node.curveMode || 'soft') === 'bezier') {
        const cpOut  = node.cpOut || { dt: 0, dr: 0 };
        const hTheta = theta_i + cpOut.dt;
        const hR     = r_i     + cpOut.dr;
        const { x: hx, y: hy } = polarToXY(cx, cy, hTheta, hR, scale);

        ctx.save();
        ctx.strokeStyle = '#e91e63';
        ctx.lineWidth   = 1.2;
        ctx.setLineDash([3, 2]);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(hx, hy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(hx, hy, 5, 0, TWO_PI);
        ctx.fillStyle   = '#e91e63';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth   = 1.5;
        ctx.stroke();
        ctx.restore();

        _handles.push({ nodeIdx: i, type: 'out', x: hx, y: hy });
      }

      // Incoming handle — for the segment INTO this node (uses node.cpIn)
      const prevIdx = (i - 1 + n) % n;
      if ((state.nodes[prevIdx].curveMode || 'soft') === 'bezier') {
        const cpIn   = node.cpIn || { dt: 0, dr: 0 };
        const hTheta = theta_i + cpIn.dt;
        const hR     = r_i     + cpIn.dr;
        const { x: hx, y: hy } = polarToXY(cx, cy, hTheta, hR, scale);

        ctx.save();
        ctx.strokeStyle = '#9c27b0';
        ctx.lineWidth   = 1.2;
        ctx.setLineDash([3, 2]);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(hx, hy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.beginPath();
        ctx.arc(hx, hy, 5, 0, TWO_PI);
        ctx.fillStyle   = '#9c27b0';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth   = 1.5;
        ctx.stroke();
        ctx.restore();

        _handles.push({ nodeIdx: i, type: 'in', x: hx, y: hy });
      }
    });
  }

  // ── Centre mark (crosshair) ──────────────────────────
  // Always shown on canvas preview; for SVG see saveSVG()
  ctx.save();
  const CH = holeR > 0 ? Math.max(holeR * scale + 4, 7) : 7;
  ctx.strokeStyle = '#78909c';
  ctx.lineWidth   = 0.75;
  ctx.beginPath();
  ctx.moveTo(cx - CH, cy); ctx.lineTo(cx + CH, cy);
  ctx.moveTo(cx, cy - CH); ctx.lineTo(cx, cy + CH);
  ctx.stroke();
  if (holeR === 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, TWO_PI);
    ctx.fillStyle = '#78909c';
    ctx.fill();
  }
  ctx.restore();

  // ── Scale bar ────────────────────────────────────────
  const scaleBarMM = pickScaleBar(maxR);
  const scaleBarPx = scaleBarMM * scale;
  const SX = 18, SY = H - 18;
  ctx.save();
  ctx.strokeStyle = '#78909c';
  ctx.lineWidth   = 1.5;
  ctx.beginPath();
  ctx.moveTo(SX, SY); ctx.lineTo(SX + scaleBarPx, SY);
  ctx.moveTo(SX, SY - 4); ctx.lineTo(SX, SY + 4);
  ctx.moveTo(SX + scaleBarPx, SY - 4); ctx.lineTo(SX + scaleBarPx, SY + 4);
  ctx.stroke();
  ctx.font         = '10px sans-serif';
  ctx.fillStyle    = '#78909c';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillText(`${scaleBarMM} mm`, SX + scaleBarPx / 2, SY - 6);
  ctx.restore();
}

function pickScaleBar(maxR) {
  // Pick a round-number bar that's roughly 20% of the cam radius
  const target = maxR * 0.2;
  const nice   = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500];
  return nice.reduce((prev, cur) =>
    Math.abs(cur - target) < Math.abs(prev - target) ? cur : prev
  );
}

// ════════════════════════════════════════════════════════
//  DURATION REDISTRIBUTION
// ════════════════════════════════════════════════════════
/**
 * After a node at `changedIndex` has its duration updated,
 * redistribute the remaining percentage evenly among all
 * unlocked nodes that are NOT the changed one.
 */
function redistributeDurations(changedIndex) {
  const nodes = state.nodes;
  const n     = nodes.length;

  let fixedSum   = 0;
  const freeIdx  = [];

  for (let i = 0; i < n; i++) {
    if (i === changedIndex || nodes[i].locked) {
      fixedSum += Math.max(0, nodes[i].duration);
    } else {
      freeIdx.push(i);
    }
  }

  const remaining = Math.max(0, 100 - fixedSum);
  if (freeIdx.length === 0) return;
  const share = remaining / freeIdx.length;
  freeIdx.forEach(i => { nodes[i].duration = share; });
}

// ════════════════════════════════════════════════════════
//  ADD / REMOVE NODES
// ════════════════════════════════════════════════════════
function addNode() {
  const idx = state.nodes.length;
  state.nodes.push({
    id:        state.nextId++,
    name:      `Node ${idx + 1}`,
    mm:        0,
    duration:  0,
    locked:    false,
    curveMode: 'soft',
    cpIn:      { dt: 0, dr: 0 },
    cpOut:     { dt: 0, dr: 0 }
  });
  redistributeDurations(idx);
  renderAll();
}

function removeNode(index) {
  if (state.nodes.length <= 2) return;
  state.nodes.splice(index, 1);
  // Re-spread unlocked durations
  const lockedSum = state.nodes.filter(n => n.locked)
                               .reduce((s, n) => s + n.duration, 0);
  const unlocked  = state.nodes.filter(n => !n.locked);
  const remaining = Math.max(0, 100 - lockedSum);
  if (unlocked.length > 0) {
    const share = remaining / unlocked.length;
    unlocked.forEach(n => { n.duration = share; });
  }
  renderAll();
}

// ════════════════════════════════════════════════════════
//  RENDER CONTROLS (left panel)
// ════════════════════════════════════════════════════════
function renderAll() {
  const maxR = maxRadius();

  // Header stats
  document.getElementById('max-radius-val').textContent = maxR;
  document.getElementById('max-dia-val').textContent    = maxR * 2;
  document.getElementById('canvas-info').textContent    =
    `Base: ${state.baseCircle} mm · Travel: ${state.travel} mm · Max Radius: ${maxR} mm`;

  // Duration total
  const total   = state.nodes.reduce((s, n) => s + n.duration, 0);
  const totEl   = document.getElementById('duration-total');
  totEl.textContent = `Total: ${total.toFixed(2)}%`;
  totEl.className   = 'duration-total ' + (Math.abs(total - 100) < 0.05 ? 'ok' : 'warn');

  // Node cards
  const list = document.getElementById('node-list');
  list.innerHTML = '';

  state.nodes.forEach((node, i) => {
    const card = document.createElement('div');
    card.className = 'node-card';
    card.innerHTML = `
      <div class="node-card-header">
        <span class="node-badge">${i + 1}</span>
        <input type="text" class="node-name-input"
               value="${esc(node.name)}" data-idx="${i}"
               placeholder="Node name">
        <button class="node-remove-btn" data-idx="${i}"
                ${state.nodes.length <= 2 ? 'disabled' : ''}
                title="Remove node">×</button>
      </div>
      <div class="node-card-body">
        <div class="node-field">
          <div class="node-field-label">Extension</div>
          <div class="input-unit-row">
            <input type="number" class="node-mm-input"
                   value="${node.mm}" min="0" max="${state.travel}"
                   step="0.1" data-idx="${i}">
            <span class="unit-label">mm</span>
          </div>
        </div>
        <div class="node-field">
          <div class="node-field-label">Duration</div>
          <div class="input-unit-row">
            <input type="number" class="node-dur-input"
                   value="${node.duration.toFixed(2)}"
                   min="0" max="100" step="0.1" data-idx="${i}">
            <span class="unit-label">%</span>
          </div>
        </div>
        <div class="node-field">
          <div class="node-field-label">Lock</div>
          <button class="node-lock-btn ${node.locked ? 'locked' : ''}"
                  data-idx="${i}"
                  title="${node.locked ? 'Unlock duration (will auto-redistribute)' : 'Lock duration'}">
            ${node.locked ? '🔒' : '🔓'}
          </button>
        </div>
        <div class="node-field">
          <div class="node-field-label">Curve</div>
          <button class="node-curve-btn mode-${node.curveMode || 'soft'}"
                  data-idx="${i}"
                  title="Curve mode: ${curveLabel(node.curveMode || 'soft')} — click to cycle">
            ${curveIcon(node.curveMode || 'soft')}
          </button>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  // Wire events
  list.querySelectorAll('.node-name-input').forEach(el => {
    el.addEventListener('input', e => {
      state.nodes[+e.target.dataset.idx].name = e.target.value;
      draw();
    });
  });

  list.querySelectorAll('.node-mm-input').forEach(el => {
    el.addEventListener('input', e => {
      const i   = +e.target.dataset.idx;
      const val = clamp(parseFloat(e.target.value) || 0, 0, state.travel);
      state.nodes[i].mm = val;
      draw();
    });
    el.addEventListener('change', e => {
      const i   = +e.target.dataset.idx;
      const val = clamp(parseFloat(e.target.value) || 0, 0, state.travel);
      state.nodes[i].mm = val;
      e.target.value    = val;
      draw();
    });
  });

  list.querySelectorAll('.node-dur-input').forEach(el => {
    el.addEventListener('change', e => {
      const i   = +e.target.dataset.idx;
      const val = Math.max(0, parseFloat(e.target.value) || 0);
      state.nodes[i].duration = val;
      redistributeDurations(i);
      renderAll();
    });
  });

  list.querySelectorAll('.node-lock-btn').forEach(el => {
    el.addEventListener('click', e => {
      const i = +e.currentTarget.dataset.idx;
      state.nodes[i].locked = !state.nodes[i].locked;
      renderAll();
    });
  });

  list.querySelectorAll('.node-curve-btn').forEach(el => {
    el.addEventListener('click', e => {
      const i     = +e.currentTarget.dataset.idx;
      const nodes = state.nodes;
      nodes[i].curveMode = nextCurveMode(nodes[i].curveMode);
      if (nodes[i].curveMode === 'bezier') {
        // Seed from current Catmull-Rom slopes so the curve doesn't jump.
        // Store as {dt, dr} polar offsets: handle is placed at ±h/3 from the node,
        // with dr chosen so that dr/dt = Catmull-Rom slope (curve is unchanged).
        const radii    = nodes.map(nd => state.baseCircle + nd.mm);
        const spans    = nodes.map(nd => nd.duration / 100 * Math.PI * 2);
        const s        = computeSlopes(radii, spans);
        const n        = nodes.length;
        const prevIdx  = (i - 1 + n) % n;
        const dtOut    =  spans[i]       / 3;
        const dtIn     = -spans[prevIdx] / 3;
        nodes[i].cpOut = { dt: dtOut, dr: s[i] * dtOut };
        nodes[i].cpIn  = { dt: dtIn,  dr: s[i] * dtIn  };
      }
      renderAll();
    });
  });

  list.querySelectorAll('.node-remove-btn').forEach(el => {
    el.addEventListener('click', e => {
      removeNode(+e.currentTarget.dataset.idx);
    });
  });

  draw();
}

const esc   = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// ════════════════════════════════════════════════════════
//  HOLE SHAPE HELPERS
// ════════════════════════════════════════════════════════
const HOLE_SHAPES = ['circle', 'square', 'rectangle', 'octagon'];
const HOLE_ICONS  = { circle: '○', square: '□', rectangle: '▬', octagon: '⬡' };

/**
 * Add a hole-shape sub-path to the current canvas path (call ctx.beginPath first).
 * r = radius / half-size in canvas pixels.
 * For rectangle the "diameter" is the short axis; long axis = 2×.
 */
function addHolePath(ctx, cx, cy, r, shape) {
  const TWO_PI = Math.PI * 2;
  switch (shape) {
    case 'circle':
      ctx.arc(cx, cy, r, 0, TWO_PI);
      break;
    case 'square':
      ctx.rect(cx - r, cy - r, r * 2, r * 2);
      break;
    case 'rectangle':
      ctx.rect(cx - r, cy - r * 2, r * 2, r * 4);
      break;
    case 'octagon': {
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * TWO_PI - Math.PI / 2;
        const x = cx + r * Math.cos(a);
        const y = cy + r * Math.sin(a);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      break;
    }
  }
}

/** Build an SVG path-data string for the hole shape (in mm coords). */
function holeSVGPath(cx, cy, r, shape) {
  const f = v => v.toFixed(4);
  switch (shape) {
    case 'circle':
      // Two 180° arcs (SVG can't do a full arc in one command)
      return `M ${f(cx+r)},${f(cy)} A ${f(r)},${f(r)} 0 1,1 ${f(cx-r)},${f(cy)} A ${f(r)},${f(r)} 0 1,1 ${f(cx+r)},${f(cy)} Z`;
    case 'square':
      return `M ${f(cx-r)},${f(cy-r)} L ${f(cx+r)},${f(cy-r)} L ${f(cx+r)},${f(cy+r)} L ${f(cx-r)},${f(cy+r)} Z`;
    case 'rectangle':
      return `M ${f(cx-r)},${f(cy-2*r)} L ${f(cx+r)},${f(cy-2*r)} L ${f(cx+r)},${f(cy+2*r)} L ${f(cx-r)},${f(cy+2*r)} Z`;
    case 'octagon': {
      let d = '';
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 - Math.PI / 2;
        const x = f(cx + r * Math.cos(a));
        const y = f(cy + r * Math.sin(a));
        d += i === 0 ? `M ${x},${y}` : ` L ${x},${y}`;
      }
      return d + ' Z';
    }
  }
  return '';
}

// ════════════════════════════════════════════════════════
//  SAVE / LOAD — JSON profile
// ════════════════════════════════════════════════════════
function saveJSON() {
  const data = {
    baseCircle:   state.baseCircle,
    travel:       state.travel,
    holeDiameter: state.holeDiameter,
    holeShape:    state.holeShape,
    channelWidth: state.channelWidth,
    outerWidth:   state.outerWidth,
    outerCircle:  state.outerCircle,
    nodes: state.nodes.map(n => ({
      id:        n.id,
      name:      n.name,
      mm:        n.mm,
      duration:  n.duration,
      locked:    n.locked,
      curveMode: n.curveMode || 'soft',
      cpIn:      n.cpIn  ?? { dt: 0, dr: 0 },
      cpOut:     n.cpOut ?? { dt: 0, dr: 0 }
    })),
    nextId: state.nextId
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'cam-profile.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function loadJSON() {
  const input = document.createElement('input');
  input.type  = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = evt => {
      try {
        const data = JSON.parse(evt.target.result);
        if (!Array.isArray(data.nodes) || data.nodes.length < 2) throw new Error('Invalid profile');
        state.baseCircle   = +data.baseCircle || 50;
        state.travel       = +data.travel     || 60;
        state.holeDiameter = (data.holeDiameter != null && data.holeDiameter !== '') ? +data.holeDiameter : null;
        state.holeShape    = HOLE_SHAPES.includes(data.holeShape) ? data.holeShape : 'circle';
        state.channelWidth = data.channelWidth != null ? Math.max(0, +data.channelWidth) : 2;
        state.outerWidth   = data.outerWidth   != null ? Math.max(0, +data.outerWidth)   : 10;
        state.outerCircle  = data.outerCircle  != null ? !!data.outerCircle : true;
        state.nextId       = +data.nextId || (data.nodes.length + 1);
        state.nodes      = data.nodes.map(n => ({
          id:        +n.id        || 1,
          name:      String(n.name || 'Node'),
          mm:        clamp(+n.mm || 0, 0, state.travel),
          duration:  Math.max(0, +n.duration || 0),
          locked:    !!n.locked,
          curveMode: CURVE_MODES.includes(n.curveMode) ? n.curveMode : 'soft',
          cpIn:      (n.cpIn  && typeof n.cpIn  === 'object') ? n.cpIn  : { dt: 0, dr: 0 },
          cpOut:     (n.cpOut && typeof n.cpOut === 'object') ? n.cpOut : { dt: 0, dr: 0 }
        }));
        document.getElementById('input-base').value          = state.baseCircle;
        document.getElementById('input-travel').value        = state.travel;
        document.getElementById('input-hole-dia').value      = state.holeDiameter != null ? state.holeDiameter : '';
        document.getElementById('btn-hole-shape').textContent = HOLE_ICONS[state.holeShape] || '○';
        document.getElementById('input-channel-width').value = state.channelWidth;
        document.getElementById('input-outer-width').value   = state.outerWidth;
        document.getElementById('chk-outer-circle').checked  = state.outerCircle;
        renderAll();
      } catch (err) {
        alert('Could not load profile: ' + err.message);
      }
    };
    reader.readAsText(file);
  });
  input.click();
}

// ════════════════════════════════════════════════════════
//  SAVE — True-to-Size SVG
// ════════════════════════════════════════════════════════
function saveSVG(labeled) {
  const maxR       = maxRadius();
  const cw         = state.channelWidth;
  const ow         = state.outerWidth;
  const hasOuter   = ow > 0;
  const outerExtent = hasOuter ? maxR + cw + ow : maxR;
  const padding    = 22;           // mm margin
  const size       = (outerExtent + padding) * 2;
  const cx         = size / 2;
  const cy         = size / 2;
  const TWO_PI     = Math.PI * 2;
  const SAMPLES    = 1440;
  const f4         = v => v.toFixed(4);
  const f3         = v => v.toFixed(3);

  // Build a sampled polar path (in SVG mm coords), offset by offsetMM from cam profile
  function buildCamPathD(offsetMM) {
    let d = '';
    for (let i = 0; i <= SAMPLES; i++) {
      const theta = (i / SAMPLES) * TWO_PI;
      const r     = radiusAtAngle(theta) + offsetMM;
      const x     = f4(cx + Math.sin(theta) * r);
      const y     = f4(cy - Math.cos(theta) * r);
      d += i === 0 ? `M ${x},${y}` : ` L ${x},${y}`;
    }
    return d + ' Z';
  }

  const camPathD = buildCamPathD(0);

  // ── Hole ────────────────────────────────────────────────
  const holeR   = state.holeDiameter ? state.holeDiameter / 2 : 0;
  let holeSVG   = '';
  if (holeR > 0) {
    const hd = holeSVGPath(cx, cy, holeR, state.holeShape);
    holeSVG = `  <!-- Central hole -->\n  <path d="${hd}" fill="none" stroke="#000000" stroke-width="0.5"/>\n`;
  }

  // ── Centre mark (cross) ─────────────────────────────────
  const crossR = holeR > 0 ? holeR + 3 : 3;
  let centreSVG = '';
  if (labeled) {
    // Always show cross in labelled; extend arms outside hole
    centreSVG = `  <!-- Centre mark -->\n`
      + `  <line x1="${f3(cx-crossR)}" y1="${f3(cy)}" x2="${f3(cx+crossR)}" y2="${f3(cy)}" stroke="#546e7a" stroke-width="0.3"/>\n`
      + `  <line x1="${f3(cx)}" y1="${f3(cy-crossR)}" x2="${f3(cx)}" y2="${f3(cy+crossR)}" stroke="#546e7a" stroke-width="0.3"/>\n`;
    if (holeR === 0) {
      centreSVG += `  <circle cx="${f3(cx)}" cy="${f3(cy)}" r="0.6" fill="#546e7a"/>\n`;
    }
  }
  // Outline (no hole): no cross, no centre dot — nothing needed

  // ── Outer piece paths ────────────────────────────────────
  let outerSVG = '';
  if (hasOuter) {
    const innerOffsetPathD = buildCamPathD(cw);            // channel boundary
    const outerEdge = state.outerCircle
      ? `  <!-- Outer circle -->\n  <circle cx="${f3(cx)}" cy="${f3(cy)}" r="${f3(maxR + cw + ow)}" fill="none" stroke="#000000" stroke-width="0.5"/>\n`
      : `  <!-- Outer shaped edge -->\n  <path d="${buildCamPathD(cw + ow)}" fill="none" stroke="#000000" stroke-width="0.5" stroke-linejoin="round"/>\n`;
    outerSVG = `  <!-- Channel inner boundary (offset ${cw} mm) -->\n`
      + `  <path d="${innerOffsetPathD}" fill="none" stroke="#000000" stroke-width="0.5" stroke-linejoin="round" stroke-dasharray="1.5,1"/>\n`
      + outerEdge;
  }

  // ── Node markers / labels ────────────────────────────────
  const angles = nodeAngles();
  let nodesSVG = '';
  state.nodes.forEach((node, i) => {
    const theta = angles[i];
    const r     = state.baseCircle + node.mm;
    const nx    = Math.sin(theta);
    const ny    = -Math.cos(theta);
    const px    = f3(cx + nx * r);
    const py    = f3(cy - Math.cos(theta) * r);
    nodesSVG += `  <circle cx="${px}" cy="${py}" r="1.2" fill="#1565c0"/>\n`;
    if (labeled) {
      const bx     = f3(cx + nx * state.baseCircle);
      const by     = f3(cy + ny * state.baseCircle);
      nodesSVG += `  <line x1="${bx}" y1="${by}" x2="${px}" y2="${py}" stroke="#1565c0" stroke-width="0.3" stroke-dasharray="1,1"/>\n`;
      const LDIST  = 7;
      const lx     = f3(cx + nx * (r + LDIST));
      const ly     = f3(cy + ny * (r + LDIST));
      const anchor = nx >  0.15 ? 'start' : nx < -0.15 ? 'end' : 'middle';
      const base   = ny >  0.15 ? 'hanging' : ny < -0.15 ? 'auto' : 'middle';
      nodesSVG += `  <text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="${base}" font-family="Arial,sans-serif" font-size="3.5" fill="#37474f">${esc(node.name)} (${node.mm} mm)</text>\n`;
    }
  });

  const svg = `<?xml version="1.0" encoding="UTF-8"?>
<!-- Cam Profile Designer export -->
<!-- Base: ${state.baseCircle} mm | Travel: ${state.travel} mm | Max Radius: ${maxR} mm -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="${size}mm" height="${size}mm"
     viewBox="0 0 ${size} ${size}">

  <!-- Reference circles (guides only) -->
  <circle cx="${f3(cx)}" cy="${f3(cy)}" r="${state.baseCircle}" fill="none" stroke="#cccccc" stroke-width="0.3" stroke-dasharray="2,2"/>
  <circle cx="${f3(cx)}" cy="${f3(cy)}" r="${maxR}" fill="none" stroke="#cccccc" stroke-width="0.3" stroke-dasharray="2,2"/>

  <!-- Start indicator -->
  <line x1="${f3(cx)}" y1="${f3(cy)}" x2="${f3(cx)}" y2="${f3(cy - outerExtent - 10)}" stroke="#ef5350" stroke-width="0.3" stroke-dasharray="2,1.5"/>
  <text x="${f3(cx)}" y="${f3(cy - outerExtent - 12)}" text-anchor="middle" dominant-baseline="auto" font-family="Arial,sans-serif" font-size="3" fill="#ef5350">START</text>

  <!-- Cam profile -->
  <path d="${camPathD}" fill="none" stroke="#000000" stroke-width="0.5" stroke-linejoin="round"/>

${outerSVG}
${holeSVG}
${centreSVG}
${nodesSVG}
</svg>`;

  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = labeled ? 'cam-profile-labelled.svg' : 'cam-profile.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ════════════════════════════════════════════════════════
//  SAVE — Clean SVG (no annotations, no labels)
// ════════════════════════════════════════════════════════
function saveSVGClean() {
  const maxR        = maxRadius();
  const cw          = state.channelWidth;
  const ow          = state.outerWidth;
  const hasOuter    = ow > 0;
  const outerExtent = hasOuter ? maxR + cw + ow : maxR;
  const padding     = 22;
  const size        = (outerExtent + padding) * 2;
  const cx          = size / 2;
  const cy          = size / 2;
  const TWO_PI      = Math.PI * 2;
  const SAMPLES     = 1440;
  const f4          = v => v.toFixed(4);
  const f3          = v => v.toFixed(3);

  function buildCamPathD(offsetMM) {
    let d = '';
    for (let i = 0; i <= SAMPLES; i++) {
      const theta = (i / SAMPLES) * TWO_PI;
      const r     = radiusAtAngle(theta) + offsetMM;
      const x     = f4(cx + Math.sin(theta) * r);
      const y     = f4(cy - Math.cos(theta) * r);
      d += i === 0 ? `M ${x},${y}` : ` L ${x},${y}`;
    }
    return d + ' Z';
  }

  const camPathD = buildCamPathD(0);

  // Hole
  const holeR = state.holeDiameter ? state.holeDiameter / 2 : 0;
  let holeSVG = '';
  if (holeR > 0) {
    const hd = holeSVGPath(cx, cy, holeR, state.holeShape);
    holeSVG = `  <path d="${hd}" fill="none" stroke="#000000" stroke-width="0.5"/>\n`;
  }

  // Outer piece
  let outerSVG = '';
  if (hasOuter) {
    const innerOffsetPathD = buildCamPathD(cw);
    const outerEdge = state.outerCircle
      ? `  <circle cx="${f3(cx)}" cy="${f3(cy)}" r="${f3(maxR + cw + ow)}" fill="none" stroke="#000000" stroke-width="0.5"/>\n`
      : `  <path d="${buildCamPathD(cw + ow)}" fill="none" stroke="#000000" stroke-width="0.5" stroke-linejoin="round"/>\n`;
    outerSVG = `  <path d="${innerOffsetPathD}" fill="none" stroke="#000000" stroke-width="0.5" stroke-linejoin="round" stroke-dasharray="1.5,1"/>\n`
      + outerEdge;
  }

  const svg = `<?xml version="1.0" encoding="UTF-8"?>
<!-- Cam Profile Designer export -->
<!-- Base: ${state.baseCircle} mm | Travel: ${state.travel} mm | Max Radius: ${maxR} mm -->
<svg xmlns="http://www.w3.org/2000/svg"
     width="${size}mm" height="${size}mm"
     viewBox="0 0 ${size} ${size}">

  <!-- Cam profile -->
  <path d="${camPathD}" fill="none" stroke="#000000" stroke-width="0.5" stroke-linejoin="round"/>

${outerSVG}${holeSVG}</svg>`;

  const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = 'cam-profile-clean.svg';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {

  document.getElementById('input-base').addEventListener('change', e => {
    const val = Math.max(1, parseFloat(e.target.value) || 1);
    state.baseCircle = val;
    e.target.value   = val;
    renderAll();
  });

  document.getElementById('input-travel').addEventListener('change', e => {
    const oldTravel   = state.travel;
    const val         = Math.max(0, parseFloat(e.target.value) || 0);
    state.travel      = val;
    e.target.value    = val;
    // If a node was pinned to the old max travel, follow the new value
    state.nodes.forEach(nd => {
      if (nd.mm === oldTravel) nd.mm = val;
      nd.mm = clamp(nd.mm, 0, val);
    });
    renderAll();
  });

  // ── Central hole ──────────────────────────────────────
  document.getElementById('input-hole-dia').addEventListener('input', e => {
    const v = e.target.value.trim();
    state.holeDiameter = v === '' ? null : Math.max(0, parseFloat(v) || 0);
    draw();
  });
  document.getElementById('input-hole-dia').addEventListener('change', e => {
    const v = e.target.value.trim();
    state.holeDiameter = v === '' ? null : Math.max(0, parseFloat(v) || 0);
    if (state.holeDiameter !== null) e.target.value = state.holeDiameter;
    draw();
  });

  document.getElementById('btn-hole-shape').addEventListener('click', () => {
    const idx = HOLE_SHAPES.indexOf(state.holeShape);
    state.holeShape = HOLE_SHAPES[(idx + 1) % HOLE_SHAPES.length];
    document.getElementById('btn-hole-shape').textContent = HOLE_ICONS[state.holeShape];
    draw();
  });

  // ── Channel & outer piece ─────────────────────────────
  document.getElementById('input-channel-width').addEventListener('change', e => {
    state.channelWidth = Math.max(0, parseFloat(e.target.value) || 0);
    e.target.value = state.channelWidth;
    draw();
  });

  document.getElementById('input-outer-width').addEventListener('change', e => {
    state.outerWidth = Math.max(0, parseFloat(e.target.value) || 0);
    e.target.value = state.outerWidth;
    draw();
  });

  document.getElementById('chk-outer-circle').addEventListener('change', e => {
    state.outerCircle = e.target.checked;
    draw();
  });

  document.getElementById('btn-add-node').addEventListener('click', addNode);

  document.getElementById('btn-save-json').addEventListener('click', saveJSON);
  document.getElementById('btn-load-json').addEventListener('click', loadJSON);

  document.getElementById('btn-save-outline').addEventListener('click', () => saveSVG(false));
  document.getElementById('btn-save-labeled').addEventListener('click', () => saveSVG(true));
  document.getElementById('btn-save-svg').addEventListener('click', saveSVGClean);

  // Redraw when the canvas wrapper resizes
  new ResizeObserver(() => draw()).observe(
    document.getElementById('canvas-wrapper')
  );

  // ── Bezier handle drag ─────────────────────────────────────────────────
  const canvas  = document.getElementById('cam-canvas');
  const TWO_PI  = Math.PI * 2;

  canvas.addEventListener('mousedown', e => {
    const mx = e.offsetX, my = e.offsetY;
    let best = null, bestDist = Infinity;
    _handles.forEach(h => {
      const d = Math.hypot(mx - h.x, my - h.y);
      if (d < 10 && d < bestDist) { bestDist = d; best = h; }
    });
    if (best) {
      _drag = { nodeIdx: best.nodeIdx, type: best.type };
      canvas.style.cursor = 'grabbing';
      e.preventDefault();
    }
  });

  canvas.addEventListener('mousemove', e => {
    const mx = e.offsetX, my = e.offsetY;
    if (_drag) {
      const dx  = mx - _cx;
      const dy  = my - _cy;
      const r_m = Math.hypot(dx, dy) / _scale;
      const θ_m = ((Math.atan2(dx, -dy) % TWO_PI) + TWO_PI) % TWO_PI;

      const node   = state.nodes[_drag.nodeIdx];
      const angles = nodeAngles();
      const θ_i    = angles[_drag.nodeIdx];
      const r_i    = state.baseCircle + node.mm;

      // Angular delta, normalised to ±π to handle the seam correctly
      let dθ = θ_m - θ_i;
      if (dθ >  Math.PI) dθ -= TWO_PI;
      if (dθ < -Math.PI) dθ += TWO_PI;

      const dr = r_m - r_i;
      if (_drag.type === 'out') {
        // Outgoing handle: clamp dt > 0 (must stay ahead of node)
        node.cpOut = { dt: Math.max(1e-4, dθ), dr };
      } else {
        // Incoming handle: clamp dt < 0 (must stay behind node)
        node.cpIn  = { dt: Math.min(-1e-4, dθ), dr };
      }
      draw();
    } else {
      // Hover cursor feedback
      const near = _handles.some(h => Math.hypot(mx - h.x, my - h.y) < 10);
      canvas.style.cursor = near ? 'grab' : 'default';
    }
  });

  canvas.addEventListener('mouseup', () => {
    _drag = null;
    canvas.style.cursor = 'default';
  });

  canvas.addEventListener('mouseleave', () => {
    if (_drag) { _drag = null; canvas.style.cursor = 'default'; }
  });

  renderAll();
});
</script>
</body>
</html>
